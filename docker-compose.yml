version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    volumes:
      - whisper-cache:/root/.cache/huggingface
    # Not exposed externally — only the web container calls it
    # Model is downloaded on first use and cached in the whisper-cache volume

  web:
    image: node:20-slim
    working_dir: /app
    env_file: .env
    volumes:
      - .:/app
      - audio-uploads:/opt/dnd-sheet/audio
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for Postgres on db:5432...' &&
        until node -e \"const net=require('net');const s=net.createConnection({host:'db',port:5432},()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1000);\"; do sleep 1; done &&
        echo 'DB is reachable. Proceeding...' &&
        apt-get update -y &&
        apt-get install -y --no-install-recommends openssl &&
        rm -rf /var/lib/apt/lists/* &&
        npm install &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run build &&
        npm start
      "

volumes:
  dbdata:
  whisper-cache:
  audio-uploads:
